server:
  port: 8080

spring:
  application:
    name: ai-enterprise-assistant

ai:
  provider: deepseek
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY}
  model: deepseek-v4-flash
  system-prompt: 你是一个专业、简洁、可靠的企业 AI 助手。回答要准确，优先使用简洁中文。
  temperature: 0.7
  max-tokens: 1024
  #聊天时只带最近 10 条消息
  max-history-messages: 10
  #历史达到 20 条后开始摘要
  summary-trigger-messages: 20
  #之后每新增 10 条消息再摘要一次
  summary-interval-messages: 10
  #每次摘要最多看最近 20 条消息
  summary-max-messages: 20

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level traceId=%X{traceId} %logger{36} - %msg%n"